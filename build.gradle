// For building the open-source release of TalkBack.

apply plugin: 'com.android.application'

apply from: 'shared.gradle'

apply from: 'version.gradle'

final BUILD_TIMESTAMP = new Date().format('yyyy_MM_dd_HHmm')

// Momento da compilação em segundos (o workflow do GitHub Actions define LEITOR_BUILD_EPOCH
// para que o versionCode e a tag do Release venham do mesmo instante).
final BUILD_EPOCH = (System.getenv("LEITOR_BUILD_EPOCH") ?: (System.currentTimeMillis().intdiv(1000)).toString()) as long
// versionCode = segundos desde 2024-01-01 UTC: cresce a cada compilação e cabe no limite do
// Android (2100000000) até por volta de 2090.
final LEITOR_VERSION_CODE = (BUILD_EPOCH - 1704067200L) as int

dependencies {
    implementation project(':talkback')
}

buildscript {
    ext.gradle_plugin_version = "8.11.1"
    ext.kotlin_version = "1.9.23"
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "org.aspectj:aspectjtools:1.8.1"
        // Here we set the version of the Android Gradle Plugin used by this
        // script. It is best to use as new a version as possible, but beware
        // that each version of the Gradle Plugin requires that the version of
        // Gradle (used to drive the build) be a certain version or above. The
        // correspondence is tracked here:
        // https://developer.android.com/build/releases/gradle-plugin#updating-gradle
        classpath "com.android.tools.build:gradle:$gradle_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

android {
    namespace "com.android.talkback"
    defaultConfig {
        applicationId talkbackApplicationId
        // Cada compilação recebe um número maior que a anterior, para que o Android aceite
        // instalar a versão nova por cima da antiga.
        versionCode LEITOR_VERSION_CODE
        // No GitHub Actions o versionName é igual à tag do Release (sem o "v"), para o Obtainium
        // comparar a versão instalada com a publicada.
        versionName System.getenv("LEITOR_VERSION_NAME") ?: (talkbackVersionName + "-" + BUILD_TIMESTAMP)
        minSdkVersion 26
        targetSdkVersion 30
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        multiDexEnabled true
    }
    // Assinatura fixa (projeto pessoal): a mesma chave em todas as compilações
    // permite atualizar o app sem desinstalar.
    signingConfigs {
        leitorVini {
            storeFile file('keystore/leitor-vini.jks')
            storePassword 'leitorvini'
            keyAlias 'leitorvini'
            keyPassword 'leitorvini'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.leitorVini
        }
        release {
            signingConfig signingConfigs.leitorVini
        }
    }
    packagingOptions {
        exclude 'LICENSE'
        exclude 'README'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    productFlavors {
        phone {
            dimension "target"
        }
        wear {
            dimension "target"
            versionNameSuffix "-wear"
        }
    }
}
